openapi: 3.1.0
info:
  title: Unsupported secured widgets
  version: 1.0.0
components:
  securitySchemes:
    mTLS:
      type: mutualTLS
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - mTLS: []
paths:
  /widgets:
    get:
      operationId: widgets.list
      responses:
        '200':
          description: Widgets found
    post:
      operationId: widgets.create
      security:
        - mTLS: []
          ApiKeyAuth: []
      responses:
        '201':
          description: Widget created
