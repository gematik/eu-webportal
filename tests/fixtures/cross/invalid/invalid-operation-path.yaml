arazzo: 1.1.0
info:
  title: Invalid operation paths
  version: 1.0.0
sourceDescriptions:
  - name: widgets
    url: ../valid/openapi.yaml
    type: openapi
workflows:
  - workflowId: invalid-operation-paths
    steps:
      - stepId: malformed
        operationPath: /widgets
      - stepId: unknown-source
        operationPath: '{$sourceDescriptions.missing.url}#/paths/~1widgets/get'
      - stepId: wrong-target
        operationPath: '{$sourceDescriptions.widgets.url}#/paths/~1widgets'
      - stepId: missing-operation
        operationPath: '{$sourceDescriptions.widgets.url}#/paths/~1widgets/post'
