openapi: 3.1.0
info:
  title: Response widgets
  version: 1.0.0
paths:
  /widgets:
    post:
      operationId: widgets.create
      responses:
        '201':
          description: Widget created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  details:
                    type: object
                    properties:
                      state:
                        type: string
        '400':
          description: Invalid widget
