arazzo: 1.1.0
info:
  title: Response workflow
  version: 1.0.0
sourceDescriptions:
  - name: widgets
    url: ./responses-openapi.yaml
    type: openapi
workflows:
  - workflowId: create-widget
    steps:
      - stepId: create
        operationId: widgets.create
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
          state: $response.body#/details/state
          location: $response.header.Location
