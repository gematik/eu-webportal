arazzo: 1.1.0
info:
  title: Parameter widget workflow
  version: 1.0.0
sourceDescriptions:
  - name: widgets
    url: ./parameters-openapi.yaml
    type: openapi
workflows:
  - workflowId: read-widget
    steps:
      - stepId: read
        operationId: widgets.read
        parameters:
          - name: id
            in: path
            value: widget-1
          - name: locale
            in: query
            value: de-DE
          - name: x-trace-id
            in: header
            value: trace-1
