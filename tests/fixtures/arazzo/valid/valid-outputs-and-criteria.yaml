arazzo: 1.1.0
info:
  title: Valid Outputs and Criteria
  version: 1.0.0
sourceDescriptions:
  - name: widgets
    url: ./widgets.yaml
    type: openapi
workflows:
  - workflowId: create-widget
    outputs:
      createdId: $steps.create.outputs.id
    steps:
      - stepId: create
        operationId: widgets.create
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
