    post:
      operationId: createWidget
      requestBody:
        content:
          application/json:
            examples:
              first:
                value:
                  name: First
              external:
                externalValue: ./examples/widget.json
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                id: widget-1
