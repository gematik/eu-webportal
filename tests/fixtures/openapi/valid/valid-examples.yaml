openapi: 3.1.0
info:
  title: Valid Examples API
  version: 1.0.0
components:
  examples:
    Widget:
      summary: Widget example
      value:
        id: widget-1
  parameters:
    Query:
      name: query
      in: query
      examples:
        named:
          value: active
      schema:
        type: string
paths:
