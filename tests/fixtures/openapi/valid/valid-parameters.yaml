openapi: 3.1.0
info:
  title: Valid Parameter API
  version: 1.0.0
components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      schema:
        type: string
paths:
  /widgets/{widgetId}:
    parameters:
      - name: widgetId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getWidget
      parameters:
        - name: filter
          in: query
          content:
            application/json:
              schema:
                type: object
      responses:
        '200':
          description: OK
