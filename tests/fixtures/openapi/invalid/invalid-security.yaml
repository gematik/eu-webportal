openapi: 3.1.0
info:
  title: Invalid Security API
  version: 1.0.0
components:
  securitySchemes:
    BrokenApiKey:
      type: apiKey
      in: body
    BrokenHttp:
      type: http
    BrokenOAuth:
      type: oauth2
      flows:
        clientCredentials:
          scopes: {}
    BrokenOidc:
      type: openIdConnect
      openIdConnectUrl: relative
    Unsupported:
      type: custom
security:
  - Unknown: []
  - BrokenApiKey: no-array
  - BrokenApiKey:
      - invalid-scope
  - BrokenOAuth:
      - missing-scope
paths:
  /widgets:
    get:
      operationId: listWidgets
      security: {}
      responses:
        '200':
          description: OK
