[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-arazzo-tool"
version = "0.1.0"
description = "Local OpenAPI and Arazzo mocking and workflow tool"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "httpcore>=1,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "PyYAML>=6.0,<7",
]

[project.scripts]
tool = "tools.openapi_arazzo_tool.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "ruff>=0.11,<1",
  "types-jsonschema",
  "types-PyYAML",
]

[tool.mypy]
python_version = "3.11"
files = ["tools", "tests"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["tools", "tools.*"]
